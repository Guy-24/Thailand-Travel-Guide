name: Thailand Travel Guide CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install All Dependencies
      run: |
        python -m pip install --upgrade pip
        # ติดตั้ง Library ทั้งหมดที่คุณต้องใช้โดยตรง
        pip install fastapi[all] pytest httpx requests sqlalchemy psycopg2-binary PyJWT argon2-cffi email-validator pgvector pydantic-settings python-dotenv

    - name: Run Tests
      env:
        DATABASE_URL: sqlite:///./test.db
        SECRET_KEY: "test_secret_key_for_ci_only"
        Client_ID: mock_id
        Client_Secret: mock_secret
      run: |
        cd backend
        python -m pytest test_main.py -v