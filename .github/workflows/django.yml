name: Thailand Travel Guide CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    # ใส่ env ไว้ตรงนี้เพื่อให้ทุกขั้นตอน (Steps) มองเห็นเหมือนกันหมด
    env:
      DATABASE_URL: sqlite:///./test.db
      SECRET_KEY: "super-secret-key-for-testing-only" 
      ALGORITHM: "HS256"
      CLIENT_ID: "mock_id"
      CLIENT_SECRET: "mock_secret"

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install All Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install fastapi[all] pytest httpx requests sqlalchemy psycopg2-binary PyJWT argon2-cffi email-validator pgvector pydantic-settings python-dotenv

    - name: Run Tests
      env:
        DATABASE_URL: "sqlite:///./test.db"
        SECRET_KEY: "ci-test-key"
        secret_key: "ci-test-key"
        ALGORITHM: "HS256"
        CLIENT_ID: "mock_id"
        CLIENT_SECRET: "mock_secret"
      run: |
        cd backend
        python -m pytest test_main.py -v